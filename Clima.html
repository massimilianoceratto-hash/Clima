<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App del Clima Libre</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #87CEEB; /* Color cielo */
text-align: center;
padding: 50px;
color: #333;
}
.contenedor {
background-color: white;
padding: 20px;
border-radius: 10px;
display: inline-block;
box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}
input, button {
padding: 10px;
font-size: 16px;
margin: 5px;
}
</style>
</head>
<body>
<div class="contenedor">
<h1> El Clima en Vivo</h1>
<p>Escribe una ciudad para saber cómo está el clima ahora mismo.</p>
<input type="text" id="ciudad" placeholder="Ej: Merlo, San Luis">
<button onclick="buscarClima()">Buscar</button>
<h2 id="resultado"></h2>
</div>
<script>
function buscarClima() {
const ciudad = document.getElementById('ciudad').value;
// PEGA TU API KEY AQUÍ ABAJO
const apiKey = 'bfb6a2f66ee16afd7a0b3cb0ab99b680';
const url =
`https://api.openweathermap.org/data/2.5/weather?q=${ciudad}&appid=${apiKey}
&units=metric&lang=es`;
fetch(url)
.then(respuesta => respuesta.json())
.then(datos => {
const temperatura = datos.main.temp;
const descripcion = datos.weather[0].description;
document.getElementById('resultado').innerText =
`En ${ciudad} hace ${temperatura}°C. El cielo está: ${descripcion}.`;
})
.catch(error => {
document.getElementById('resultado').innerText =
'Error: Ciudad no encontrada o API inactiva.';
});
}
</script>
</body>
</html>
